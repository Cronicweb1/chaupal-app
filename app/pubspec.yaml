name: chaupal
description: Chaupal — board games & baithak. Ludo, Carrom, Tic Tac Toe, Snakes & Ladders with coins, cups, market and chat.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  supabase_flutter: ^2.5.6
  socket_io_client: ^2.0.3+1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
